{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div style="max-width: 900px;">

    <div class="mb-4">
      <h1 class="fw-bold">Change tires</h1>
      <p class="text-muted">
        Select a tire set to install on the vehicle
      </p>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <form method="post">
          {% csrf_token %}

          {{ form|crispy }}

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">
              Change tires
            </button>

            <a
                href="{% url 'fleet:vehicle-detail' pk=view.kwargs.vehicle_pk %}"
                class="btn btn-outline-secondary"
            >
              Cancel
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
{% endblock %}
