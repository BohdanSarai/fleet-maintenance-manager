{% extends "base.html" %}

{% block content %}
  <h1>Delete maintenance plan</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">
      Yes, delete
    </button>
    <a
        href="{% url 'fleet:vehicle-detail' pk=object.vehicle.pk %}"
        class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
