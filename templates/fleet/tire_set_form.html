{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div style="max-width: 900px;">

    <div class="mb-4">
      {% if object %}
        <h1 class="fw-bold">Edit tire set</h1>
        <p class="text-muted">
          Update tire set information
        </p>
      {% else %}
        <h1 class="fw-bold">Add tire set</h1>
        <p class="text-muted">
          Add a new tire set to the fleet
        </p>
      {% endif %}
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">

        <form method="post">
          {% csrf_token %}

          {{ form|crispy }}

          <div class="mt-4">
            <button type="submit" class="btn btn-primary">
              {% if object %}
                Save changes
              {% else %}
                Add tire set
              {% endif %}
            </button>

            <a
                href="{% url 'fleet:tire-set-list' %}"
                class="btn btn-outline-secondary"
            >
              Cancel
            </a>
          </div>
        </form>

      </div>
    </div>

  </div>
{% endblock %}
