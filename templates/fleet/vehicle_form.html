{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="container-fluid">

    <div class="mb-4">
      {% if object %}
        <h1 class="fw-bold">Edit vehicle</h1>
        <p class="text-muted">Update vehicle information</p>
      {% else %}
        <h1 class="fw-bold">Add vehicle</h1>
        <p class="text-muted">Add a new vehicle to the fleet</p>
      {% endif %}
    </div>

    <div class="row">
      <div class="col-xl-8 col-lg-10">

        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <form method="post">
              {% csrf_token %}

              {{ form|crispy }}

              <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                  {% if object %}
                    Save changes
                  {% else %}
                    Add vehicle
                  {% endif %}
                </button>

                <a
                    href="{% url 'fleet:vehicle-list' %}"
                    class="btn btn-outline-secondary"
                >
                  Cancel
                </a>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>

  </div>
{% endblock %}
