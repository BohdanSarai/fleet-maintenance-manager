{% extends "base.html" %}

{% block content %}
  <h1>Delete vehicle</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ vehicle.brand }} {{ vehicle.model }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Yes, delete
    </button>

    <a
        href="{% url 'fleet:vehicle-detail' pk=vehicle.pk %}"
        class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
