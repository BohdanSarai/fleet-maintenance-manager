{% extends "base.html" %}

{% block content %}
  <form method="get">
    {{ search_form.as_p }}
    <button type="submit">Search</button>
  </form>

  <ul>
    {% for vehicle in vehicle_list %}
      <li><a href="{% url 'fleet:vehicle-detail' pk=vehicle.pk %}">{{ vehicle.brand }} {{ vehicle.model }}</a></li>

    {% endfor %}
  </ul>

  {% include "includes/pagination.html" %}

{% endblock %}
